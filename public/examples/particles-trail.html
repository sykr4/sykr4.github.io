<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SYKR4 · Ejemplo 1 — Partículas interactivas + rastro del ratón (Three.js)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05060a; color: #e9ecf3; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  h1 { position: fixed; left: 24px; top: 20px; margin: 0; font-size: clamp(28px, 6vw, 72px); letter-spacing: -.05em; line-height: .92; pointer-events: none; }
  h1 span { background: linear-gradient(100deg, #5cf2ff, #8b5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ui { position: fixed; left: 24px; right: 24px; bottom: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #8b93a7; pointer-events: none; }
  .ui b { color: #5cf2ff; font-weight: 500; }
</style>
<!-- Three.js como módulo ES desde CDN (sin build) -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<h1>SYKR4<br /><span>partículas vivas</span></h1>
<div class="ui">
  <span><b>Mueve el ratón</b> · la fuerza depende de su velocidad · <b>clic</b> = onda expansiva</span>
  <span id="stats">—</span>
</div>

<script type="module">
import * as THREE from "three";

/* =====================================================================
   0. PRESUPUESTO SEGÚN DISPOSITIVO (LOD sencillo)
   ===================================================================== */
const isTouch = matchMedia("(hover: none), (pointer: coarse)").matches;
const cores = navigator.hardwareConcurrency || 8;
const tier = isTouch || cores <= 4 ? "mid" : "high";
const COUNT = tier === "high" ? 30000 : 12000;
const DPR = Math.min(devicePixelRatio || 1, tier === "high" ? 1.75 : 1.5);

/* =====================================================================
   1. UN SOLO RENDERER para partículas + rastro (menos contextos WebGL)
   ===================================================================== */
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, depth: false, stencil: false, powerPreference: "high-performance" });
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x05060a, 1);
renderer.autoClear = false; // controlamos las pasadas manualmente

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 50);
camera.position.z = 7;

/* =====================================================================
   2. GEOMETRÍA: esfera de Fibonacci (80%) + núcleo volumétrico (20%)
   ===================================================================== */
const positions = new Float32Array(COUNT * 3);
const randoms = new Float32Array(COUNT * 4);
const golden = Math.PI * (3 - Math.sqrt(5));
const shellCount = Math.floor(COUNT * 0.8);
for (let i = 0; i < COUNT; i++) {
  let x, y, z;
  if (i < shellCount) {
    y = 1 - (i / (shellCount - 1)) * 2;
    const r = Math.sqrt(1 - y * y), th = golden * i;
    const R = 1.6 * (1 + (Math.random() - 0.5) * 0.05);
    x = Math.cos(th) * r * R; z = Math.sin(th) * r * R; y *= R;
  } else {
    const r = 1.4 * Math.cbrt(Math.random());
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    x = Math.cos(th) * s * r; y = u * r; z = Math.sin(th) * s * r;
  }
  positions.set([x, y, z], i * 3);
  randoms.set([Math.random(), Math.random(), Math.random(), Math.random()], i * 4);
}
const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geometry.setAttribute("aRnd", new THREE.BufferAttribute(randoms, 4));

/* =====================================================================
   3. SHADER DE PARTÍCULAS
      - respiración con simplex noise
      - repulsión del ratón (fuerza = velocidad del ratón + clic)
      - "bloom falso": sprite con caída suave + blending aditivo (sin postpro)
   ===================================================================== */
const NOISE = /* glsl */ `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uMouse: { value: new THREE.Vector3(99, 99, 0) },
    uStrength: { value: 0 },
    uSize: { value: tier === "high" ? 26 : 34 },
    uPixelRatio: { value: DPR },
  },
  vertexShader: /* glsl */ `
    uniform float uTime; uniform vec3 uMouse; uniform float uStrength; uniform float uSize; uniform float uPixelRatio;
    attribute vec4 aRnd;
    varying vec3 vColor; varying float vAlpha;
    ${NOISE}
    void main() {
      vec3 p = position;
      float n = snoise(p * 0.6 + vec3(0.0, 0.0, uTime * 0.15));
      p += normalize(p + 1e-4) * n * 0.12;                       // respiración

      vec4 world = modelMatrix * vec4(p, 1.0);
      vec2 toP = world.xy - uMouse.xy;                            // repulsión en espacio mundo
      float f = smoothstep(1.3, 0.0, length(toP)) * uStrength;
      world.xy += normalize(toP + 1e-4) * f * 0.9;
      world.z += f * 0.8;

      vec4 mv = viewMatrix * world;
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * (0.35 + aRnd.y * 1.1) * (1.0 + f) * uPixelRatio / max(-mv.z, 0.5);

      vec3 cyan = vec3(0.36, 0.95, 1.0), violet = vec3(0.55, 0.36, 1.0), volt = vec3(0.84, 1.0, 0.29);
      vec3 col = mix(cyan, violet, clamp(0.5 + p.y * 0.25 + n * 0.6, 0.0, 1.0));
      float led = step(0.97, aRnd.w) * (0.5 + 0.5 * sin(uTime * 3.0 + aRnd.x * 40.0)); // "LEDs"
      vColor = mix(col, volt, led) + f * 0.5;
      vAlpha = (0.3 + aRnd.z * 0.7) * (1.0 + led);
    }`,
  fragmentShader: /* glsl */ `
    varying vec3 vColor; varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = pow(smoothstep(0.5, 0.0, d), 1.8);
      gl_FragColor = vec4(vColor, a * vAlpha);
    }`,
  transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
});
const points = new THREE.Points(geometry, material);
points.frustumCulled = false; // el shader desplaza vértices: evitamos culling erróneo
scene.add(points);

/* =====================================================================
   4. RASTRO "FLUID-LITE" (técnica descrita por Lusion)
      Ping-pong de 2 render targets de 8 bits a 1/4 de resolución:
      RG = velocidad (codificada 0..1), B = densidad. Advección + blur + disipación.
   ===================================================================== */
const fxScene = new THREE.Scene();
const fxCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quad.frustumCulled = false;
fxScene.add(quad);
const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const clearMat = new THREE.ShaderMaterial({ vertexShader: FS_VERT, fragmentShader: `void main(){ gl_FragColor = vec4(0.5, 0.5, 0.0, 1.0); }`, depthTest: false, depthWrite: false });

const simMat = new THREE.ShaderMaterial({
  uniforms: {
    uPrev: { value: null }, uMouse: { value: new THREE.Vector2() }, uPrevMouse: { value: new THREE.Vector2() },
    uVel: { value: new THREE.Vector2() }, uForce: { value: 0 }, uRadius: { value: 0.03 },
    uAspect: { value: 1 }, uTexel: { value: new THREE.Vector2() },
  },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */ `
    uniform sampler2D uPrev; uniform vec2 uMouse, uPrevMouse, uVel, uTexel; uniform float uForce, uRadius, uAspect;
    varying vec2 vUv;
    float segDist(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.0,1.0); return length(pa-ba*h); }
    void main() {
      vec2 vel = texture2D(uPrev, vUv).rg * 2.0 - 1.0;
      vec2 back = vUv - vel * uTexel * 5.0;                          // advección
      vec4 s = texture2D(uPrev, back);
      vec2 v = s.rg * 2.0 - 1.0; float dens = s.b;
      float blur = texture2D(uPrev, back + vec2(uTexel.x,0.0)).b + texture2D(uPrev, back - vec2(uTexel.x,0.0)).b
                 + texture2D(uPrev, back + vec2(0.0,uTexel.y)).b + texture2D(uPrev, back - vec2(0.0,uTexel.y)).b;
      dens = mix(dens, blur * 0.25, 0.4);                           // difusión barata
      dens = max(dens * 0.972 - 0.0035, 0.0);                        // disipación (llega a 0 en 8 bits)
      v = sign(v) * max(abs(v * 0.95) - 0.006, 0.0);
      vec2 p = vec2(vUv.x * uAspect, vUv.y);                         // inyección a lo largo del segmento
      float d = segDist(p, vec2(uPrevMouse.x * uAspect, uPrevMouse.y), vec2(uMouse.x * uAspect, uMouse.y));
      float splat = exp(-(d * d) / (uRadius * uRadius)) * uForce;
      v = mix(v, clamp(uVel, -1.0, 1.0), clamp(splat * 1.5, 0.0, 1.0));
      dens = clamp(dens + splat, 0.0, 1.0);
      gl_FragColor = vec4(v * 0.5 + 0.5, dens, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});

const displayMat = new THREE.ShaderMaterial({
  uniforms: { uSim: { value: null } },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */ `
    uniform sampler2D uSim; varying vec2 vUv;
    void main() {
      vec4 s = texture2D(uSim, vUv);
      float dens = s.b; float speed = clamp(length(s.rg * 2.0 - 1.0) * 1.4, 0.0, 1.0);
      vec3 col = mix(vec3(0.55, 0.36, 1.0), vec3(0.36, 0.95, 1.0), smoothstep(0.05, 0.7, dens));
      col = mix(col, vec3(0.84, 1.0, 0.29), smoothstep(0.6, 1.0, speed) * 0.4);
      col += smoothstep(0.75, 1.0, dens) * 0.3;
      float a = smoothstep(0.0, 0.55, dens) * 0.85;
      gl_FragColor = vec4(col * a, a);                               // premultiplicado
    }`,
  transparent: true, premultipliedAlpha: true, blending: THREE.AdditiveBlending, // se suma sobre las partículas
  depthTest: false, depthWrite: false,
});

let rtA, rtB;
const makeRT = (w, h) => new THREE.WebGLRenderTarget(w, h, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, type: THREE.UnsignedByteType, depthBuffer: false,
});

/* =====================================================================
   5. INPUT (se lee una vez por frame dentro del bucle)
   ===================================================================== */
const pointer = { x: innerWidth / 2, y: innerHeight / 2, px: innerWidth / 2, py: innerHeight / 2, moved: false, lastMove: 0 };
let burst = 0;
addEventListener("pointermove", (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (!pointer.moved) { pointer.px = pointer.x; pointer.py = pointer.y; pointer.moved = true; }
  pointer.lastMove = performance.now();
}, { passive: true });
addEventListener("pointerdown", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.moved = true; burst = 1; }, { passive: true });

/* =====================================================================
   6. RESIZE
   ===================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.z = w / h < 1 ? 8.5 : 7;
  camera.updateProjectionMatrix();
  const sw = Math.max(64, Math.ceil(w / 4)), sh = Math.max(64, Math.ceil(h / 4));
  rtA?.dispose(); rtB?.dispose();
  rtA = makeRT(sw, sh); rtB = makeRT(sw, sh);
  quad.material = clearMat;
  for (const rt of [rtA, rtB]) { renderer.setRenderTarget(rt); renderer.render(fxScene, fxCam); }
  simMat.uniforms.uTexel.value.set(1 / sw, 1 / sh);
  simMat.uniforms.uAspect.value = w / h;
}
let resizeTimer = 0;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
resize();

/* =====================================================================
   7. BUCLE
   ===================================================================== */
const ray = new THREE.Vector3(), target = new THREE.Vector3();
let velocity = 0, strength = 0, last = performance.now(), fpsT = 0, fpsN = 0;
const prevUv = new THREE.Vector2(0.5, 0.5), uv = new THREE.Vector2(0.5, 0.5);
const stats = document.getElementById("stats");

function frame(now) {
  const dt = Math.min(0.064, (now - last) / 1000); last = now;

  // Velocidad del ratón (px/frame, suavizada)
  const dx = pointer.x - pointer.px, dy = pointer.y - pointer.py;
  pointer.px = pointer.x; pointer.py = pointer.y;
  velocity += (Math.hypot(dx, dy) - velocity) * 0.3;

  // Fuerza = presencia + velocidad + clic
  const presence = now - pointer.lastMove < 2500 && !isTouch ? 0.3 : 0;
  strength += (Math.min(1.4, presence + Math.min(velocity / 35, 1) * 0.9 + burst * 0.9) - strength) * 0.08;

  // Ratón (NDC) → punto en el plano z = 0
  ray.set((pointer.x / innerWidth) * 2 - 1, -(pointer.y / innerHeight) * 2 + 1, 0.5).unproject(camera).sub(camera.position).normalize();
  target.copy(camera.position).addScaledVector(ray, -camera.position.z / ray.z);
  if (pointer.moved) material.uniforms.uMouse.value.lerp(target, 0.25);
  material.uniforms.uStrength.value = strength;
  material.uniforms.uTime.value = now / 1000;

  points.rotation.y += dt * 0.08;
  camera.position.x += (((pointer.x / innerWidth) * 2 - 1) * 0.35 - camera.position.x) * 0.035;
  camera.position.y += ((-(pointer.y / innerHeight) * 2 + 1) * 0.22 - camera.position.y) * 0.035;
  camera.lookAt(0, 0, 0);

  // Pasada 1: partículas
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(scene, camera);

  // Pasada 2: simulación del rastro (a 1/4 de resolución)
  uv.set(pointer.x / innerWidth, 1 - pointer.y / innerHeight);
  if (uv.distanceTo(prevUv) > 0.3) prevUv.copy(uv); // evita rayas al entrar en la ventana
  const du = uv.x - prevUv.x, dv = uv.y - prevUv.y;
  const su = simMat.uniforms;
  su.uPrev.value = rtA.texture;
  su.uMouse.value.copy(uv); su.uPrevMouse.value.copy(prevUv);
  su.uVel.value.set(du * 28, dv * 28);
  su.uForce.value = Math.max(Math.min(Math.hypot(du, dv) * 55, 1), burst);
  su.uRadius.value = 0.022 + burst * 0.05;
  quad.material = simMat;
  renderer.setRenderTarget(rtB);
  renderer.render(fxScene, fxCam);
  [rtA, rtB] = [rtB, rtA];
  prevUv.copy(uv);

  // Pasada 3: rastro sumado sobre las partículas
  displayMat.uniforms.uSim.value = rtA.texture;
  quad.material = displayMat;
  renderer.setRenderTarget(null);
  renderer.render(fxScene, fxCam);

  burst *= 0.88;

  fpsT += dt; fpsN++;
  if (fpsT > 0.5) { stats.textContent = `${COUNT.toLocaleString("es-ES")} partículas · ${Math.round(fpsN / fpsT)} FPS · DPR ${DPR}`; fpsT = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
